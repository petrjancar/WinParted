name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # WinUI 3 builds only on Windows.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build WinParted.sln -c Release

      # Unit tests only. WinParted.Storage.IntegrationTests need administrator rights and create
      # virtual disks, so they run on a developer PC (see README), never in CI.
      - name: Unit tests
        run: dotnet test tests/WinParted.Core.Tests -c Release --no-build --logger "trx;LogFileName=core-tests.trx" --results-directory test-results

      - name: Publish self-contained build
        run: dotnet publish src/WinParted.App -c Release -r win-x64 -o artifacts/WinParted-win-x64

      # Without WinParted.pri the window fails to load (see the EnableMsixTooling note in the project file).
      - name: Check the published build
        shell: pwsh
        run: if (-not (Test-Path artifacts/WinParted-win-x64/WinParted.pri)) { throw 'WinParted.pri is missing from the published build' }

      # Installer (installer/WinParted.iss), versioned from <Version> in Directory.Build.props.
      # Inno Setup 6 is preinstalled on windows-latest; install it only if a future image drops it.
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Installing Inno Setup failed' }
          }
          $version = (dotnet msbuild src/WinParted.App/WinParted.App.csproj -getProperty:Version).Trim()
          & $iscc "/DAppVersion=$version" installer/WinParted.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "artifacts/WinParted-$version-setup.exe")) { throw 'The installer was not created' }

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: WinParted-setup
          path: artifacts/WinParted-*-setup.exe
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results
          retention-days: 7

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: WinParted-win-x64
          path: artifacts/WinParted-win-x64
          retention-days: 7
